{% extends "base.html" %}
{% from "_icons.html" import icon %}
{% block title %}Change password — Case Management{% endblock %}
{% block content %}
<h1>{{ icon('password', 22) }} Change password</h1>
<form method="post" action="{{ url_for('change_password') }}" class="form-card">
  <input type="hidden" name="csrf_token" value="{{ session.get('csrf_token', '') }}">
  <label>Current password
    <input type="password" name="current_password" autocomplete="current-password" required>
  </label>
  <label>New password (at least 8 characters)
    <input type="password" name="new_password" autocomplete="new-password" required minlength="8">
  </label>
  <label>Confirm new password
    <input type="password" name="confirm_password" autocomplete="new-password" required minlength="8">
  </label>
  <button type="submit" class="btn btn-primary">Change password</button>
</form>
{% endblock %}
