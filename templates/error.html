{% extends "base.html" %}
{% from "_icons.html" import icon %}
{% block title %}Error {{ code }} — Case Management{% endblock %}
{% block content %}
<div class="empty-state empty-stack">
  <div class="empty-icon">{{ icon('alert', 30) }}</div>
  <h2>{{ code }}</h2>
  <p>{{ message }}</p>
  <a href="{{ url_for('dashboard') }}" class="btn btn-primary">{{ icon('dashboard', 16) }} Back to dashboard</a>
</div>
{% endblock %}
